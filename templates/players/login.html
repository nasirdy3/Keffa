{% extends 'base.html' %}

{% block title %}Login - KEFA{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 0 auto;">
    <h1 class="card-title" style="text-align: center;">Welcome Back! 🎮</h1>
    <p style="margin-bottom: 2rem; text-align: center; opacity: 0.8;">Login to access your KEFA dashboard</p>
    
    <form method="post">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" name="username" id="username" required autocomplete="username">
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" name="password" id="password" required autocomplete="current-password">
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Login</button>
    </form>
    
    <p style="margin-top: 1.5rem; text-align: center;">
        Don't have an account? <a href="{% url 'players:register' %}" style="color: var(--gold); font-weight: 600; text-decoration: underline;">Register here</a>
    </p>
</div>
{% endblock %}
