{% extends 'base.html' %}

{% block title %}Login - KEFA{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 0 auto;">
    <h1 style="margin-bottom: 2rem; color: #667eea;">Welcome Back!</h1>
    <p style="margin-bottom: 2rem; color: #666;">Login to access your KEFA dashboard</p>
    
    <form method="post">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" name="username" id="username" required>
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" name="password" id="password" required>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
    </form>
    
    <p style="margin-top: 1.5rem; text-align: center;">
        Don't have an account? <a href="{% url 'register' %}" style="color: #667eea; font-weight: 600;">Register here</a>
    </p>
</div>
{% endblock %}
