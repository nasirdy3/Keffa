services:
  # Web Service for KEFA Server + Background processes
  - type: web
    name: kefa-platform
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: bash start.sh
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: kefa-redis
          property: connectionString
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: PYTHON_VERSION
        value: 3.11.0

  # Redis instance (Free tier available on Render)
  - type: redis
    name: kefa-redis
    plan: free
    ipAllowList: []

databases:
  - key: DATABASE_URL
    sync: false
