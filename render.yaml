services:
  - type: web
    name: kefa-platform
    env: python
    plan: free
    # We use a custom build script to handle everything cleanly
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: bash start.sh
    envVars:
      - key: DATABASE_URL
        sync: false # Set this manually in the Render Dashboard (Neon URL)
      - key: REDIS_URL
        fromService:
          type: redis
          name: kefa-redis
          property: connectionString
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0

  - type: redis
    name: kefa-redis
    plan: free
    ipAllowList: []

