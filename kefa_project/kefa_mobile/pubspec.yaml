name: kefa_mobile
description: The official KEFA mobile application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.0.5
  
  # Networking
  http: ^1.1.0
  
  # UI & Fonts
  google_fonts: ^6.1.0
  flutter_animate: ^4.2.0
  glassmorphism: ^3.0.0
  font_awesome_flutter: ^10.6.0
  
  # Native Features (Chapter 15)
  local_auth: ^2.1.6 # Biometric Login
  flutter_secure_storage: ^9.0.0 # Secure Token Storage
  web_socket_channel: ^2.4.0 # For Chat
  connectivity_plus: ^5.0.2 # Offline Detection
  
  # Utils
  intl: ^0.18.1
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
